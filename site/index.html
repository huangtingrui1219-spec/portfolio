<script>
// ---- 开场动画：3秒或点击跳过，同一次访问只播一次 ----
(function () {
  var intro = document.getElementById('intro');
  if (sessionStorage.getItem('introPlayed')) {
    intro.style.display = 'none';
    return;
  }
  var close = function () {
    intro.classList.add('done');
    sessionStorage.setItem('introPlayed', '1');
  };
  setTimeout(close, 3000);
  intro.addEventListener('click', close);
})();

// ---- 滚动显现：一个一个亮起来 ----
(function () {
  var items = document.querySelectorAll('.work');
  if (!('IntersectionObserver' in window)) {
    items.forEach(function (el) { el.classList.add('show'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('show'); io.unobserve(e.target); }
    });
  }, { threshold: 0.18 });
  items.forEach(function (el) { io.observe(el); });
})();

// ---- 火箭：点火→升空→回到顶部 ----
(function () {
  var r = document.getElementById('rocket');
  r.addEventListener('click', function () {
    if (r.classList.contains('fly')) return;
    r.classList.add('fly');
    setTimeout(function () { window.scrollTo({ top: 0, behavior: 'smooth' }); }, 550);
    setTimeout(function () { r.classList.remove('fly'); }, 1600);
  });
})();
</script>
