  .playbtn {

    margin-top: 30px; text-decoration: none;

    border: 2.5px solid var(--ink); border-radius: 999px;
    padding: 13px 34px; letter-spacing: .08em;
    box-shadow: 5px 5px 0 var(--teal);
    transition: all .3s cubic-bezier(.4,.1,.3,1.4);
  }
  .playbtn:hover { transform: translateY(-4px) rotate(-1deg); box-shadow: 8px 8px 0 var(--teal); }
  .playbtn-teal { background: var(--teal); box-shadow: 5px 5px 0 var(--pink); margin-left: 14px; }
  .playbtn-teal:hover { transform: translateY(-4px) rotate(1deg); box-shadow: 8px 8px 0 var(--pink); }
  @media (max-width: 560px) { .playbtn-teal { margin-left: 0; margin-top: 14px; } }

<script>
// 图片滚动一张张浮现
(function () {
  var items = document.querySelectorAll('.plates figure');
  if (!('IntersectionObserver' in window)) {
    items.forEach(function (el) { el.classList.add('show'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('show'); io.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  items.forEach(function (el) { io.observe(el); });
})();
</script>
