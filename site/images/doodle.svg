<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- 首页背景涂鸦：铅笔质感的线条与不规则图案。
       1080×1080 大块平铺 —— 块越大，重复周期越长，越不容易被眼睛识破。
       所有图形都收在边缘 40px 以内，所以拼接处不会切断笔画。
       大王画好自己的版本后，直接替换本文件即可（保持同名同尺寸）。 -->
  <g fill="none" stroke="#DEDEDE" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 波浪线：每段振幅都不同，才有手画的松弛感 -->
    <path d="M64 108 q 34 -13 66 -2 t 62 4 q 30 -14 60 -3 t 58 6"/>
    <path d="M470 150 q 28 -11 56 -1 t 54 5 q 26 -12 52 -2"/>
    <path d="M760 96 q 32 -14 62 -3 t 58 5"/>
    <path d="M120 780 q 30 -13 58 -2 t 56 5 q 28 -12 54 -1"/>
    <path d="M646 660 q 26 -12 52 -2 t 50 4"/>

    <!-- 螺旋 -->
    <path d="M162 300 a 9 9 0 1 1 -8 -9 a 20 19 0 1 1 20 21 a 32 31 0 1 1 -33 -31 a 44 43 0 1 1 46 44"/>
    <path d="M898 812 a 8 8 0 1 0 7 -8 a 18 17 0 1 0 -18 19 a 29 28 0 1 0 30 -28"/>

    <!-- 彩虹弧线，三层，间距不匀 -->
    <path d="M330 336 a 54 54 0 0 1 108 0"/>
    <path d="M343 336 a 41 41 0 0 1 82 0"/>
    <path d="M358 336 a 26 26 0 0 1 52 0"/>
    <path d="M700 986 a 44 44 0 0 1 88 0"/>
    <path d="M714 986 a 30 30 0 0 1 60 0"/>

    <!-- 集合符号那一类：并集、交集、包含 -->
    <path d="M576 300 v 30 a 21 21 0 0 0 42 0 v -30"/>
    <path d="M660 332 v -30 a 21 21 0 0 1 42 0 v 30"/>
    <path d="M636 420 a 26 26 0 1 0 0 -46"/>
    <path d="M620 420 h 34"/>
    <path d="M872 236 v 26 a 18 18 0 0 0 36 0 v -26"/>
    <path d="M300 906 a 22 22 0 1 1 0 -40"/>
    <path d="M286 906 h 30"/>

    <!-- 锯齿 -->
    <path d="M66 470 l 22 -20 l 20 21 l 22 -22 l 21 20 l 22 -19"/>
    <path d="M812 560 l 18 -17 l 17 18 l 19 -19 l 17 17"/>

    <!-- 不规则闭合图形，像随手圈出来的一块 -->
    <path d="M268 500 q 40 -26 78 -8 q 34 16 26 52 q -9 38 -52 40 q -46 3 -56 -34 q -8 -30 4 -50 z"/>
    <path d="M700 754 q 32 -22 62 -6 q 28 14 21 43 q -8 30 -43 32 q -37 2 -44 -28 q -6 -25 4 -41 z"/>

    <!-- 断续短线，长度不一 -->
    <path d="M470 500 h 30"/><path d="M512 500 h 18"/><path d="M542 500 h 26"/>
    <path d="M470 518 h 20"/><path d="M502 518 h 32"/>
    <path d="M150 636 h 26"/><path d="M188 636 h 16"/><path d="M216 636 h 30"/>
    <path d="M880 434 h 24"/><path d="M916 434 h 30"/>

    <!-- 小圆点群 -->
    <circle cx="672" cy="520" r="5"/>
    <circle cx="696" cy="534" r="3"/>
    <circle cx="718" cy="514" r="6.5"/>
    <circle cx="688" cy="558" r="2.6"/>
    <circle cx="404" cy="704" r="4.4"/>
    <circle cx="426" cy="718" r="2.8"/>
    <circle cx="448" cy="700" r="6"/>
    <circle cx="990" cy="640" r="3.6"/>
    <circle cx="1012" cy="656" r="5.4"/>

    <!-- 十字 / 星芒 -->
    <path d="M112 592 v 30 M97 607 h 30"/>
    <path d="M184 656 v 20 M174 666 h 20"/>
    <path d="M556 852 v 26 M543 865 h 26"/>
    <path d="M962 318 v 22 M951 329 h 22"/>
    <path d="M344 190 v 18 M335 199 h 18"/>

    <!-- 三角，边不直 -->
    <path d="M290 690 l 38 -60 q 4 -7 9 1 l 34 59 q 4 7 -5 7 l -71 0 q -9 0 -5 -7 z"/>
    <path d="M836 128 l 30 -48 q 3 -6 7 1 l 27 47 q 3 6 -4 6 l -56 0 q -7 0 -4 -6 z"/>

    <!-- 长弧扫尾 -->
    <path d="M440 946 q 60 -34 128 -14 q 48 14 74 -12"/>
    <path d="M60 214 q 52 -30 112 -12 q 42 12 64 -10"/>

    <!-- 排线组，模拟铅笔涂抹 -->
    <path d="M66 348 l 10 -22 M82 352 l 10 -22 M98 348 l 10 -22"/>
    <path d="M940 742 l 9 -20 M954 748 l 9 -20 M968 742 l 9 -20"/>
    <path d="M486 234 l 8 -18 M498 240 l 8 -18"/>
    <path d="M244 1006 l 9 -20 M258 1012 l 9 -20"/>
  </g>
</svg>
